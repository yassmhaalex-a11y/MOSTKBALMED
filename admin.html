<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOSTKBALMED | Admin</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><link rel="icon" type="image/png" href="favicon.png"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="./"><img class="brand-logo" src="logo.jpg" alt="AL-MOSTKBAL logo"><span>MOSTKBAL<span class="accent">MED</span><small>ADMIN PANEL</small></span></a><a href="./">← View catalog</a></div></header><main class="wrap admin-wrap"><h1>Catalog administration</h1><p class="muted">Only authorized administrators can change products and categories.</p><p id="status" role="status"></p><section id="loginPanel" class="admin-panel"><h2>Admin sign in</h2><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="admin-button">Sign in</button></form></section><div id="dashboard" hidden><button id="logout" class="admin-button secondary">Sign out</button><section class="admin-panel"><h2>Categories</h2><form id="categoryForm"><input type="hidden" id="categoryId"><label>Name<input id="categoryName" required maxlength="100"></label><label>Icon (emoji or symbol)<input id="categoryIcon" maxlength="10" placeholder="✚"></label><label>Description<input id="categoryDescription" maxlength="240"></label><div class="actions"><button class="admin-button">Save category</button><button type="button" id="resetCategory" class="admin-button secondary">Clear</button></div></form><div id="categoryList" class="admin-list"></div></section><section class="admin-panel"><h2>Products</h2><form id="productForm"><input type="hidden" id="productId"><label>Name<input id="productName" required maxlength="160"></label><label>Category<select id="productCategory" required></select></label><label>Description<textarea id="productDescription" rows="3" required></textarea></label><label>Specifications (one per line)<textarea id="productFeatures" rows="4"></textarea></label><label>Image URLs (optional, one per line; first image is the cover)<textarea id="productImages" rows="3" placeholder="https://example.com/photo1.jpg"></textarea></label><label>Upload multiple images (JPG, PNG or WebP; max 5 MB each)<input id="imageUpload" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><p class="muted">Existing images are shown below. Remove an image with × or select a different cover. New uploads are added when you save.</p><div id="imagePreview" class="image-preview"></div><label class="inline"><input id="productActive" type="checkbox" checked> Visible on website</label><div class="actions"><button class="admin-button">Save product</button><button type="button" id="resetProduct" class="admin-button secondary">Clear</button></div></form><div id="productList" class="admin-list"></div></section></div></main><script src="config.js"></script><script type="module" src="admin.js"></script></body></html>
